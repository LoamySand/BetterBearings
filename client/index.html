<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>BetterBearings</title>
    <meta
      name="description"
      content="A free map game for learning street names. Pick an area, then find each street on the map."
    />
    <meta name="theme-color" content="#0b6b4a" />

    <!-- Icons and manifest: built from client/brand (KAN-42) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Link previews. Absolute URLs, so staging's copy points at prod too. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BetterBearings" />
    <meta property="og:title" content="BetterBearings" />
    <meta property="og:description" content="Learn your city's streets by name. A free map game." />
    <meta property="og:url" content="https://betterbearings.net/" />
    <meta property="og:image" content="https://betterbearings.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A green street sign reading BetterBearings over a street map of Albuquerque"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <script type="module" src="/src/main.jsx"></script>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
