name: CI

on:
  push:
    branches: [Banana, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  # Cancel stale PR runs, but never a push run: that could kill a deploy halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:17-3.5 # same versions as bb-postgres
        env:
          POSTGRES_USER: bb
          POSTGRES_PASSWORD: bb_ci
          POSTGRES_DB: betterbearings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bb -d betterbearings_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Throwaway values for a throwaway database; not GitHub secrets
    env:
      DATABASE_URL: postgres://bb:bb_ci@localhost:5432/betterbearings_test
      JWT_SECRET: ci-only-jwt-secret
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --prefix server

      - name: Run migrations
        run: npm run migrate --prefix server -- up

      - run: npm test --prefix server
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint
  client-build:
    name: Client build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci --prefix client

      - run: npm run build --prefix client

  image:
    name: Build and push image
    needs: [lint, server-tests, client-build]
    # Pushes to release branches and main only; PRs stop after tests and build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/loamysand/betterbearings
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref != 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max     
  deploy:
    name: Deploy
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # main deploys production; release branches deploy staging
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      id-token: write # lets Tailscale verify this job with a GitHub OIDC token; no stored Tailscale secret

    steps:
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command runs deploy.sh; this string is its only input
          ssh -i ~/.ssh/deploy -o BatchMode=yes "loamy@$DEPLOY_HOST" "$TARGET sha-${GITHUB_SHA::7}"           