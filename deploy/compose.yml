# Production and staging use this same file, each from its own directory with its own .env:
#   /srv/betterbearings/prod     (project "betterbearings")
#   /srv/betterbearings/staging  (project "betterbearings-staging")
# Volumes and networks are prefixed by the project name, so the two never share data.

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: betterbearings
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose. Only containers on this project's network can reach Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d betterbearings"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  migrate:
    image: ghcr.io/loamysand/betterbearings:${IMAGE_TAG:-latest}
    command: ["npm", "run", "migrate", "--", "up"]
    environment:
      DATABASE_URL: postgres://bb:${POSTGRES_PASSWORD}@db:5432/betterbearings
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  app:
    image: ghcr.io/loamysand/betterbearings:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true # forwards SIGTERM to Node, so "compose down" stops in under a second instead of 10
    environment:
      DATABASE_URL: postgres://bb:${POSTGRES_PASSWORD}@db:5432/betterbearings
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Localhost only until cloudflared (H3) joins this network and reaches app:5000 directly
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    mem_limit: 512m
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7 
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["tunnel"]

volumes:
  pgdata:
  