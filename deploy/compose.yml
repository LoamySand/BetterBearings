# Production and staging use this same file, each from its own directory with its own .env:
#   /srv/betterbearings/prod     (project "betterbearings")
#   /srv/betterbearings/staging  (project "betterbearings-staging")
# Volumes and networks are prefixed by the project name, so the two never share data.

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: bb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: betterbearings
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose. Only containers on this project's network can reach Postgres.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bb -d betterbearings"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  migrate:
    image: ghcr.io/loamysand/betterbearings:${IMAGE_TAG:-latest}
    command: ["npm", "run", "migrate", "--", "up"]
    environment:
      DATABASE_URL: postgres://bb:${POSTGRES_PASSWORD}@db:5432/betterbearings
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m

  app:
    image: ghcr.io/loamysand/betterbearings:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true # forwards SIGTERM to Node, so "compose down" stops in under a second instead of 10
    environment:
      DATABASE_URL: postgres://bb:${POSTGRES_PASSWORD}@db:5432/betterbearings
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Localhost only until cloudflared (H3) joins this network and reaches app:5000 directly
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    mem_limit: 512m
  # One-shot street import (KAN-56). Not started by "up"; run it with:
  #   docker compose run --rm osm-import
  osm-import:
    image: ghcr.io/loamysand/betterbearings-osm:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://bb:${POSTGRES_PASSWORD}@db:5432/betterbearings
      OSM_PBF_URL: ${OSM_PBF_URL:-} # unset means the Geofabrik New Mexico extract
    volumes:
      - osmdata:/data # keeps the downloaded extract, so a rerun only downloads when Geofabrik has a newer one
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    mem_limit: ${OSM_MEM_LIMIT:-3g} # set from memory.peak measured on the laptop, see KAN-56
    profiles: ["osm"]

  # Self-hosted vector tiles (KAN-54). Serves every .pmtiles file in TILES_DIR as
  # /<name>/{z}/{x}/{y}.mvt, so nm.pmtiles is /nm/{z}/{x}/{y}.mvt. Reached only by cloudflared
  # on this project's network (tunnel route tiles:8080); no "ports:", so nothing to slip past ufw.
  # CORS is "*": tiles are public and fetched without credentials, and Cloudflare caches one copy
  # per URL, so a per-origin header would be served to every other origin (KAN-55).
  tiles:
    image: protomaps/go-pmtiles:v1.31.2
    command: ["serve", "/tiles", "--port=8080", "--cors=*"]
    volumes:
      - ${TILES_DIR:-/srv/betterbearings/tiles}:/tiles:ro # one copy shared by staging and prod
    restart: unless-stopped
    mem_limit: 128m # go-pmtiles keeps a 64 MB directory cache by default
    # No healthcheck: the image is distroless, with no shell or curl to run one

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7 
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["tunnel"]

volumes:
  pgdata:
  osmdata:
  