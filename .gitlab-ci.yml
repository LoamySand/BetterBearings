stages:
  - lint
  - deploy

# Variables
variables:
  NODE_VERSION: "24.11.0"

# Lint client - runs on pushes to staging and main
lint-client:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd client
    - npm install
  only:
    - main
    - staging

# Lint server - runs on pushes to staging and main
lint-server:
  stage: lint
  image: node:${NODE_VERSION}
  script:
    - cd server
    - npm install
  only:
    - main
    - staging

# Deploy to production Heroku - runs only on main
deploy-production:
  stage: deploy
  image: node:${NODE_VERSION}-alpine
  before_script:
    - apk add --no-cache git curl bash
    - curl https://cli-assets.heroku.com/install.sh | bash
    - export PATH="/usr/local/bin:$PATH"
  script:
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git fetch --unshallow || true
    - git remote add heroku https://heroku:$HEROKU_API_KEY@git.heroku.com/$HEROKU_PRODUCTION_APP.git || true
    - git push heroku HEAD:refs/heads/main --force
  only:
    - main
  when: on_success
  variables:
    GIT_DEPTH: 0

